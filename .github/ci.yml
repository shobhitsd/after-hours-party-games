# To activate GitHub Actions CI, either:
# 1. In GitHub Web UI: Move this file to .github/workflows/ci.yml
# 2. Or run: gh auth refresh -s workflow && git mv .github/ci.yml .github/workflows/ci.yml && git commit -m "ci: enable workflows" && git push
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build verification
        run: npm run build

      - name: Run unit & engine tests
        run: npm test
